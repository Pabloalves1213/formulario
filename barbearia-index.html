<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="primeira">
            <img src="img/logo.png" alt=""
            width="500px" height="720px">
        </section>

        <section class="segunda">
            <div class="form">
                <form action="#">
                    <div class="form-header">
                        <div class="title">
                            <h1>Cuidando de cada detalhe &#128136;</h1>
                    
                        </div>

                    </div>
                </form>
            </div>
            
            
            
            
            <style>
             h1{
             margin-bottom: 10px;
            }

            </style>
            <div class="form">
                <form action="">
                    <div class="form-header">
                        <div class="subtitle">
                            <p style="font-size: 40px;text-align: center;">Agende seu horario</p>

                        </div>

                    </div>
                </div>
                    <style>
                        .input-group input{
                        display: block;
                        width: 100%;
                        padding: 5%;
                        margin-bottom: 1px;
                        border:none;
                        border-radius: 10px;
                        box-shadow: 1px 1px 6px #00000041;
                        font-size: 0.8rem;
                        cursor: pointer;
                        
                    }
                    </style>
                <div class="input-group"> 
                <div class="input-group">
                    <label for="fitstname-lastname">Nome e Sobrenome</label>
                    <input id="fitstname-lastname" type="text" Nome="fitstname-lastname"
                    placeholder="Digite o seu Nome e Sobrenome" required>
                </div>
                 
                <div class="input-box">
                <label for="telephone">Contato</label>
                <input id="telephone" type="text" Telefone
                placeholder="Digite seu o seu contato" required>
                <div class="agendamento">
                <body>
                    <form action="" method="get">
                        <label for="datetime-local">Data e Hora</label>
                        <input id="Data e Hora" type="datetime-local"><br>
                        
                    </form>
                </body>

                </div>

                </div>
                </div>
                <div class="produto">
                    <ul>
                        <li>
                            <h2>Cabelo</h2>
                            <img src="img/cabelo.png" alt="" srcset=""
                            width="80px" height="80px">
                            <p class="product-description">Cabelo</p>
                            <p class="product-description"><R1>35,00</R1></p>
                            <section class="cabelo">
                            
                            </section>
                            
                        </li>
                        <li>
                            <h2>Barba</h2>
                            <img src="img/barba.png" alt="" srcset=""
                            width="80px" height="80px">
                            <p class="product-description">Barba</p>
                            <p class="product-description"><R1>30,00</R1></p>
                            <section class="Barba">
                        </li>
                        <li> 
                            <h2>Cabelo e Barba</h2>
                            <img src="img/cabelo e barba.png" alt="" srcset=""
                            width="80px" height="80px">
                            <p class="product-description">Cabelo e Barba</p>
                            <p class="product-description"><R1>55,00</R1></p>
                            <section class="cabelo e barba">
                        </li>
                    </ul>
                </div>
                        
                <div class="buton">
                    <button type="submit">Salvar</button>
                </div>

                </form> 

           


        </section>
    </main>
    
</body>

</html>
